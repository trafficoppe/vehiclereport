<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มยานพาหนะใหม่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f4f6f9;">

    <div class="container py-4 pb-5" style="max-width: 600px;">
        <!-- ปุ่มย้อนกลับ -->
        <div class="mb-3">
            <button id="btn-back" class="btn btn-link text-decoration-none fw-bold p-0" style="color: #2e5831;" onclick="goBack()">
                <i class="fa-solid fa-arrow-left me-1"></i> กลับหน้ารายการ
            </button>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4 p-md-5 bg-white">
                
                <!-- ส่วนหัว: โลโก้ และ ชื่อฟอร์ม -->
                <div class="text-center mb-4 pb-3" style="border-bottom: 2px solid #f0f0f0;">
                    <img src="LOGO.png" alt="กองกายภาพและสิ่งแวดล้อม" style="max-width: 220px; height: auto;" class="mb-3">
                    <h5 class="fw-bold mb-1" style="color: #2e5831;">แบบฟอร์มเพิ่มยานพาหนะใหม่</h5>
                    <small class="text-muted">ระบบจัดการฐานข้อมูลยานพาหนะ</small>
                </div>

                <form id="add-vehicle-form">
                    <div class="mb-3">
                        <label class="form-label fw-bold">หน่วยงาน *</label>
                        <input type="text" id="department" class="form-control bg-light" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ประเภท *</label>
                        <input type="text" id="type" class="form-control" placeholder="เช่น รถจักรยานยนต์, รถกอล์ฟ" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ยี่ห้อ / รุ่น *</label>
                        <input type="text" id="model" class="form-control" placeholder="เช่น HODA WAVE, EVT 4" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold">สี *</label>
                            <input type="text" id="color" class="form-control" placeholder="เช่น แดง, ขาว" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">ปีที่ซื้อ</label>
                            <input type="text" id="buyYear" class="form-control" placeholder="เช่น 2568">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ทะเบียน (ถ้ามี)</label>
                        <input type="text" id="plate" class="form-control" placeholder="เช่น 1กฮ1383นร">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">หมายเลข / เลขครุภัณฑ์</label>
                        <input type="text" id="assetCode" class="form-control" placeholder="เช่น 016807540200">
                    </div>
                    
                    <h6 class="fw-bold mt-4 mb-3 p-2 text-dark" style="border-left: 4px solid #2e5831; background-color: #f8f9fa;">อัปโหลดรูปภาพ</h6>
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">รูปภาพที่ 1</label>
                        <input type="file" id="img1File" class="form-control" accept="image/*">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">รูปภาพที่ 2</label>
                        <input type="file" id="img2File" class="form-control" accept="image/*">
                    </div>

                    <button type="submit" class="btn w-100 py-3 fw-bold text-white shadow-sm rounded-3 mt-2" id="submit-btn" style="background-color: #2e5831; font-size: 16px;">
                        <i class="fa-solid fa-cloud-arrow-up me-2"></i> บันทึกข้อมูลยานพาหนะ
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const deptKey = urlParams.get('dept') || 'traffic';
        const DEPT_MAP = {
            'traffic': 'งานจราจรและความปลอดภัย',
            'salaya': 'อาคารศาลายา กองกายภาพฯ'
        };
        document.getElementById('department').value = DEPT_MAP[deptKey] || "งานจราจรและความปลอดภัย";

        function goBack() { window.location.href = `list.html?dept=${deptKey}`; }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) resolve('');
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('add-vehicle-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> กำลังบันทึก...`;

            try {
                const img1File = document.getElementById('img1File').files[0];
                const img2File = document.getElementById('img2File').files[0];
                const img1Data = await fileToBase64(img1File);
                const img2Data = await fileToBase64(img2File);

                const payload = {
                    action: "add_vehicle",
                    department: document.getElementById('department').value,
                    type: document.getElementById('type').value,
                    model: document.getElementById('model').value,
                    color: document.getElementById('color').value,
                    plate: document.getElementById('plate').value || '-',
                    assetCode: document.getElementById('assetCode').value || '-',
                    img1Data: img1Data,
                    img1Name: img1File ? img1File.name : '',
                    img2Data: img2Data,
                    img2Name: img2File ? img2File.name : '',
                    buyYear: document.getElementById('buyYear').value || ''
                };

                await fetch(CONFIG.GAS_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('เพิ่มข้อมูลเรียบร้อยแล้ว');
                sessionStorage.removeItem("gasVehicleData_" + document.getElementById('department').value);
                goBack();
            } catch (err) {
                alert('เกิดข้อผิดพลาด');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up me-2"></i> บันทึกข้อมูลยานพาหนะ`;
            }
        });
    </script>
</body>
</html>
